<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NBS · Catálogo</title>
<!--
  🛒 CATÁLOGO DE NBS  (11 sep 2026)

  Sensei: "quiero un catálogo como el que usa WhatsApp Business, que el cliente vea y
  escoja y vaya poniendo en su carrito y pueda ver el total, y que haya dos precios:
  uno con descuento si paga al contado y otro normal si es a crédito".

  🔑 SOLO LOS 333 PRODUCTOS QUE HA VENDIDO ALGUNA VEZ — de los 599 que tiene en la app.
  Los 266 que nunca vendió no se le enseñan al barbero.

  Ordenados por lo que más vende, contado de sus facturas reales.
-->
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
       background:#F2F3F7;color:#151628;padding-bottom:104px}

  .cab{background:#0B1020;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:50;
       box-shadow:0 2px 12px rgba(0,0,0,.2)}
  .cab h1{margin:0;font-size:15.5px;font-weight:900;letter-spacing:.4px}
  .cab .neg{font-size:12px;color:#D9B24C;font-weight:800;margin-top:1px}
  .buscar{width:100%;padding:11px 13px;border:none;border-radius:10px;font-size:15px;
          margin-top:9px;background:#fff}

  /* 💵 El aviso del descuento: es lo que le hace pagar al contado */
  .aviso{background:linear-gradient(135deg,#0B7A3B,#0E9950);color:#fff;padding:9px 14px;
         font-size:12.5px;font-weight:700;text-align:center;line-height:1.45}
  .aviso b{font-size:14px}

  .chips{display:flex;gap:6px;overflow-x:auto;padding:9px 14px;background:#fff;
         border-bottom:1px solid #E5E6EE;position:sticky;top:104px;z-index:49}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 13px;border-radius:20px;border:1.5px solid #D4D5E0;
        background:#fff;font-size:12.5px;font-weight:700;color:#555;cursor:pointer;white-space:nowrap}
  .chip.on{background:#0B1020;color:#fff;border-color:#0B1020}

  .lista{padding:10px}
  .p{display:flex;gap:11px;background:#fff;border-radius:13px;padding:10px;margin-bottom:9px;
     box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .fo{width:82px;height:82px;border-radius:10px;background:#EDEEF4;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
  .fo img{width:100%;height:100%;object-fit:cover}
  .fo .sinf{font-size:9px;color:#9899AC;text-align:center;padding:4px;line-height:1.3;font-weight:800}
  .inf{flex:1;min-width:0;display:flex;flex-direction:column}
  .nom{font-size:13.5px;font-weight:800;line-height:1.28}
  .mar{font-size:10.5px;color:#8A8B9E;font-weight:700;letter-spacing:.3px;margin-top:2px}

  /* 🔑 LOS DOS PRECIOS, uno al lado del otro */
  .precios{display:flex;gap:7px;margin-top:6px;align-items:flex-end}
  .pcontado{background:#E7F6ED;border:1.5px solid #0B7A3B;border-radius:9px;
            padding:4px 9px;text-align:center}
  .pcontado .et{font-size:8.5px;font-weight:900;color:#0B7A3B;letter-spacing:.3px}
  .pcontado .vl{font-size:17px;font-weight:900;color:#0B7A3B;line-height:1.1}
  .pcredito{padding:4px 2px;text-align:center}
  .pcredito .et{font-size:8.5px;font-weight:800;color:#9899AC;letter-spacing:.3px}
  .pcredito .vl{font-size:13.5px;font-weight:800;color:#7C7D90;line-height:1.1}

  .ctl{display:flex;align-items:center;gap:7px;margin-top:7px}
  .bmas{width:36px;height:36px;border-radius:10px;border:none;background:#0B1020;color:#fff;
        font-size:19px;font-weight:700;cursor:pointer}
  .bmen{width:31px;height:31px;border-radius:9px;border:1.5px solid #D4D5E0;background:#fff;
        font-size:16px;cursor:pointer;color:#555}
  .cant{font-size:16px;font-weight:900;min-width:22px;text-align:center}

  .barra{position:fixed;left:0;right:0;bottom:0;background:#0B7A3B;color:#fff;
         padding:11px 14px;display:none;align-items:center;gap:11px;z-index:60;
         box-shadow:0 -3px 16px rgba(0,0,0,.25)}
  .barra.on{display:flex}
  .barra .t{flex:1;min-width:0}
  .barra .t1{font-size:11.5px;opacity:.92}
  .barra .t2{font-size:19px;font-weight:900}
  .barra .t3{font-size:11px;opacity:.9}
  .barra button{padding:12px 17px;border:none;border-radius:11px;background:#fff;
                color:#0B7A3B;font-size:14.5px;font-weight:900;cursor:pointer}

  .ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;
      align-items:center;justify-content:center;padding:16px}
  .ov.on{display:flex}
  .ov img{max-width:100%;max-height:72vh;border-radius:12px}
  .ov .cierra{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.22);
              color:#fff;border:none;border-radius:50%;width:40px;height:40px;
              font-size:20px;cursor:pointer}
  .ov .pie{position:absolute;bottom:28px;left:16px;right:16px;color:#fff;text-align:center;
           font-size:14px;font-weight:700;line-height:1.5}

  .car{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:150;display:none;
       align-items:flex-end;justify-content:center}
  .car.on{display:flex}
  .carcaja{background:#fff;width:100%;max-width:560px;border-radius:17px 17px 0 0;
           padding:15px;max-height:88vh;overflow:auto}
  .cl{display:flex;justify-content:space-between;align-items:center;gap:9px;
      padding:9px 0;border-bottom:1px solid #F0F0F6}
  .vacio{text-align:center;padding:46px 20px;color:#9899AC;font-size:14px;line-height:1.6}
</style>
</head>
<body>

<div class="cab">
  <h1>🧴 NUNEZ BEAUTY SUPPLY</h1>
  <div class="neg" id="negocio">Cargando…</div>
  <input class="buscar" id="q" placeholder="🔍 Buscar producto o marca…" oninput="buscar(this.value)">
</div>

<div class="aviso" id="avisoDesc">
  💵 <b>Precios de contado y a crédito</b><br>
  <span style="opacity:.92;font-size:11.5px">Los precios en verde son de contado</span>
</div>

<div class="chips" id="chips"></div>
<div class="lista" id="lista"><div class="vacio">Cargando el catálogo…</div></div>

<div class="barra" id="barra">
  <div class="t">
    <div class="t1" id="bt1">0 productos</div>
    <div class="t2" id="bt2">$0.00</div>
    <div class="t3" id="bt3"></div>
  </div>
  <button onclick="verCarrito()">Ver pedido</button>
</div>

<div class="ov" id="ovFoto" onclick="cerrarFoto()">
  <button class="cierra" onclick="cerrarFoto()">✕</button>
  <img id="ovImg" src="" alt="">
  <div class="pie" id="ovPie"></div>
</div>

<div class="car" id="car" onclick="if(event.target===this)cerrarCarrito()">
  <div class="carcaja" id="carcaja"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  🔑 EL DESCUENTO POR PAGAR AL CONTADO
//  Para cambiarlo, solo esta línea.
// ═══════════════════════════════════════════════════════════════════
var DESCUENTO_CONTADO = 0.10;      // 10%
var WHATSAPP_NBS = '14013050188';

var PRODS = [], CLIENTES = [], YO = null, COMBOS = [];
var CARRO = {}, FOTOS = {}, TROZOS = 3, _pedidos = {};
var FILTRO = 'todo', BUSCA = '';

function dinero(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }
// 🔑 Cada producto puede tener SU descuento. Si no tiene, usa el general.
function precioContado(pr, p){
  var d = (p && typeof p.desc === 'number') ? p.desc / 100 : DESCUENTO_CONTADO;
  return Math.round(pr * (1 - d) * 100) / 100;
}

// 🎁 LAS PROMOCIONES. Devuelve lo que paga de verdad por esa cantidad.
//   lleva3paga2 → cada 3 que lleve, paga 2
//   precioPorCantidad → a partir de X unidades, sale a otro precio
function conPromo(p, cant){
  var unit = precioContado(p.pr, p);
  if(!p.promo || !cant) return { total: Math.round(unit * cant * 100) / 100, ahorro: 0, texto: '' };
  var pr = p.promo;
  if(pr.tipo === 'lleva'){
    // lleva N, paga M
    var grupos = Math.floor(cant / pr.lleva);
    var sueltos = cant % pr.lleva;
    var pagan = grupos * pr.paga + sueltos;
    var total = Math.round(unit * pagan * 100) / 100;
    return { total: total, ahorro: Math.round((unit * cant - total) * 100) / 100,
             texto: 'Lleva ' + pr.lleva + ' y paga ' + pr.paga };
  }
  if(pr.tipo === 'cantidad' && cant >= pr.desde){
    var total2 = Math.round(pr.precio * cant * 100) / 100;
    return { total: total2, ahorro: Math.round((unit * cant - total2) * 100) / 100,
             texto: 'Desde ' + pr.desde + ' a $' + pr.precio.toFixed(2) + ' c/u' };
  }
  return { total: Math.round(unit * cant * 100) / 100, ahorro: 0,
           texto: pr.tipo === 'cantidad'
             ? 'Lleva ' + pr.desde + ' y te sale a $' + pr.precio.toFixed(2) : '' };
}

// 🔑 LO QUE VE EL BARBERO. Sensei, 11 sep: "compra 6 y solo pagas 5 suena mucho mejor"
// que "desde 6 a $8.33 c/u" — lo primero se entiende de un golpe, lo segundo le hace
// calcular. Los números quedan para él; aquí solo va la frase.
function textoPromo(p){
  if(!p.promo) return '';
  if(p.promo.frase) return p.promo.frase;
  // Si no escribió frase, se calcula sola: nunca queda vacío
  if(p.promo.tipo === 'lleva')
    return 'COMPRA ' + p.promo.lleva + ' Y PAGA ' + p.promo.paga;
  var paga = Math.round(p.promo.desde * p.promo.precio / p.pr);
  if(paga >= 1 && paga < p.promo.desde)
    return 'COMPRA ' + p.promo.desde + ' Y PAGA ' + paga;
  return 'LLEVA ' + p.promo.desde + ' Y AHORRA';
}

var GRUPOS = [
  ['promos',   '🔥🔥 PROMOS',   null],   // 🔑 lo primero, con las dos llamas
  ['todo',     'Todo',          null],
  ['pelo',     'Para el pelo',  /pelo|gel|wax|cream|shampoo|pomada|spray/i],
  ['colonias', 'Colonias',      /colonia|after shave|perfume/i],
  ['maquinas', 'Máquinas',      /maquina|máquina|clipper|trimmer|cargador|cuchilla/i],
  ['navajas',  'Navajas',       /navaja|afeitar|razor|blade/i],
  ['acces',    'Accesorios',    /accesorio|peine|cepillo|capa|guante|papel|porta|toalla/i],
  ['otros',    'Otros',         null]
];

fetch('productos.json').then(function(r){ return r.json(); }).then(function(d){
  PRODS = d.productos || [];
  CLIENTES = d.clientes || [];
  // 🔑 El descuento y el WhatsApp salen del archivo, para que Sensei los cambie desde
  // el administrador sin tocar código. -11 sep-
  COMBOS = d.combos || [];
  if(d.ajustes){
    if(typeof d.ajustes.descuento === 'number') DESCUENTO_CONTADO = d.ajustes.descuento / 100;
    if(d.ajustes.whatsapp) WHATSAPP_NBS = String(d.ajustes.whatsapp);
  }
  var cod = new URLSearchParams(location.search).get('c');
  YO = CLIENTES.find(function(x){ return String(x.id) === String(cod); }) || null;
  document.getElementById('negocio').textContent = YO ? (YO.neg || YO.n) : 'Haz tu pedido';
  var av = document.getElementById('avisoDesc');
  if(av) av.innerHTML = '\ud83d\udcb5 <b>' + Math.round(DESCUENTO_CONTADO*100)
    + '% de descuento</b> pagando al contado<br>'
    + '<span style="opacity:.92;font-size:11.5px">Los precios en verde son de contado</span>';
  pintarChips();
  pintar();
  cargarCarrito();
}).catch(function(){
  document.getElementById('lista').innerHTML =
    '<div class="vacio">No pude cargar el catálogo.<br>Revisa tu conexión.</div>';
});

function pintarChips(){
  document.getElementById('chips').innerHTML = GRUPOS.map(function(g){
    return '<div class="chip' + (FILTRO===g[0]?' on':'') + '" onclick="filtrar(\'' + g[0] + '\')">'
      + g[1] + '</div>';
  }).join('');
}
function filtrar(k){ FILTRO = k; pintarChips(); pintar(); window.scrollTo(0,0); }

// 🔑 Solo se repinta la lista, no la cabecera: así el teclado no se cierra al escribir
function buscar(v){ BUSCA = v; pintar(); }

function delGrupo(p, k){
  if(k === 'promos') return !!p.oferta || !!p.promo;   // 🔥🔥 lo rebajado y lo de promo
  if(k === 'todo') return true;
  var txt = (p.c || '') + ' ' + (p.n || '');
  if(k === 'otros') return !GRUPOS.some(function(x){ return x[2] && x[2].test(txt); });
  var g = GRUPOS.find(function(x){ return x[0] === k; });
  return g && g[2] ? g[2].test(txt) : false;
}

function pintar(){
  var q = (BUSCA || '').toLowerCase().trim();
  var lista = PRODS.filter(function(p){
    if(p.oculto) return false;          // 🔑 lo que Sensei escondió no se enseña
    if(!delGrupo(p, FILTRO)) return false;
    if(!q) return true;
    return (p.n + ' ' + p.m).toLowerCase().indexOf(q) >= 0;
  });

  if(!lista.length){
    document.getElementById('lista').innerHTML = FILTRO === 'promos'
      ? '<div class="vacio">Todavía no hay promociones.<br>Vuelve pronto.</div>'
      : '<div class="vacio">No encontré nada con eso.<br>Prueba con otra palabra.</div>';
    return;
  }

  // ⚡ EL AVISO DE PAGO INMEDIATO, solo aquí. Es lo que hace que valga la pena.
  var cabecera = (FILTRO === 'promos')
    ? '<div style="background:linear-gradient(135deg,#C62828,#E53935);border-radius:13px;'
      + 'padding:14px;margin-bottom:12px;text-align:center;color:#fff;'
      + 'box-shadow:0 3px 12px rgba(198,40,40,.3)">'
      + '<div style="font-size:16px;font-weight:900;letter-spacing:.4px">'
      +   '⚡ ESTOS PRECIOS SON PAGANDO DE INMEDIATO</div>'
      + '<div style="font-size:12.5px;margin-top:5px;opacity:.95">'
      +   'A crédito van al precio normal</div></div>'
    : '';

  // 📦 LOS COMBOS, arriba del todo en PROMOS
  var htmlCombos = '';
  if(FILTRO === 'promos' && COMBOS.length){
    htmlCombos = COMBOS.map(function(c, ci){
      var suelto = c.items.reduce(function(a, it){
        var p2 = PRODS.find(function(x){ return x.id === it.id; });
        return a + (p2 ? p2.pr * (it.cant || 1) : 0);
      }, 0);
      var ahorro = Math.round((suelto - c.precio) * 100) / 100;
      return '<div style="background:#fff;border:2.5px solid #6A1B9A;border-radius:14px;'
        +   'padding:13px;margin-bottom:11px;box-shadow:0 3px 10px rgba(106,27,154,.18)">'
        + '<div style="background:linear-gradient(135deg,#6A1B9A,#8E24AA);color:#fff;'
        +   'border-radius:9px;padding:9px;text-align:center;font-size:15px;font-weight:900;'
        +   'margin:-4px -4px 10px">📦 ' + esc(c.nombre) + '</div>'
        + c.items.map(function(it){
            var p3 = PRODS.find(function(x){ return x.id === it.id; });
            return '<div style="display:flex;justify-content:space-between;font-size:12.5px;'
              + 'padding:4px 0;border-bottom:1px solid #F2F2F7">'
              + '<span>' + (it.cant > 1 ? it.cant + ' × ' : '') + esc(p3 ? p3.n : '?') + '</span>'
              + '<span style="color:#8A8B9E">' + (p3 ? dinero(p3.pr * (it.cant||1)) : '') + '</span>'
              + '</div>';
          }).join('')
        + '<div style="display:flex;justify-content:space-between;align-items:center;'
        +   'margin-top:11px;padding-top:10px;border-top:2px solid #6A1B9A">'
        +   '<div><div style="font-size:10px;color:#8A8B9E;text-decoration:line-through">'
        +     dinero(suelto) + ' por separado</div>'
        +     '<div style="font-size:22px;font-weight:900;color:#6A1B9A">'
        +     dinero(c.precio) + '</div></div>'
        +   '<button onclick="pedirCombo(' + ci + ')" style="padding:12px 18px;'
        +     'background:#6A1B9A;color:#fff;border:none;border-radius:11px;font-size:14px;'
        +     'font-weight:900;cursor:pointer">Lo quiero</button>'
        + '</div>'
        + (ahorro > 0 ? '<div style="background:#F3E5F5;border-radius:8px;padding:7px;'
                      + 'margin-top:9px;text-align:center;font-size:12.5px;font-weight:800;'
                      + 'color:#6A1B9A">Te ahorras ' + dinero(ahorro) + '</div>' : '')
        + '</div>';
    }).join('');
  }

  document.getElementById('lista').innerHTML = cabecera + htmlCombos + lista.map(function(p){
    var n = CARRO[p.id] || 0;
    var pc = precioContado(p.pr, p);
    return '<div class="p">'
      + '<div class="fo" onclick="verFoto(\'' + p.id + '\')">'
      +   (p.tf ? '<img data-foto="' + p.id + '" alt="">' : '<div class="sinf">SIN<br>FOTO</div>')
      + '</div>'
      + '<div class="inf">'
      +   '<div class="nom">' + esc(p.n) + '</div>'
      +   (p.m ? '<div class="mar">' + esc(p.m) + '</div>' : '')
      // 🔑 LOS DOS PRECIOS
      +   '<div class="precios">'
      +     '<div class="pcontado"><div class="et">CONTADO</div>'
      +       '<div class="vl">' + dinero(pc) + '</div></div>'
      +     '<div class="pcredito"><div class="et">A CRÉDITO</div>'
      +       '<div class="vl">' + dinero(p.pr) + '</div></div>'
      +   '</div>'
      // 🎁 EL CARTEL DE LA PROMOCIÓN, grande y llamativo -Sensei, 11 sep-
      // En "Todo" solo una señal chiquita; el cartel grande va en PROMOS
      +   ((FILTRO !== 'promos' && (p.promo || p.oferta))
            ? '<div onclick="event.stopPropagation();filtrar(\'promos\')" '
              + 'style="font-size:11.5px;font-weight:900;color:#C62828;margin-top:5px;'
              + 'cursor:pointer">🔥 tiene promo →</div>'
            : '')
      +   (FILTRO === 'promos' && p.promo ? '<div style="background:linear-gradient(135deg,#FF9800,#F57C00);'
                   + 'border-radius:9px;padding:9px 11px;margin-top:7px;font-size:14px;'
                   + 'font-weight:900;color:#fff;text-align:center;letter-spacing:.3px;'
                   + 'box-shadow:0 2px 7px rgba(245,124,0,.35)">'
                   + '\ud83c\udf81 ' + esc(textoPromo(p)) + '</div>' : '')
      // 🔥 Y EL DE OFERTA, en rojo y grande
      +   (FILTRO === 'promos' && p.oferta ? '<div style="background:linear-gradient(135deg,#E53935,#C62828);'
                    + 'border-radius:9px;padding:8px 11px;margin-top:7px;font-size:14px;'
                    + 'font-weight:900;color:#fff;text-align:center;letter-spacing:.6px;'
                    + 'box-shadow:0 2px 7px rgba(198,40,40,.35)">'
                    + '\ud83d\udd25 EN OFERTA</div>' : '')
      +   '<div class="ctl">'
      +     (n > 0
          ? '<button class="bmen" onclick="menos(\'' + p.id + '\')">−</button>'
            + '<div class="cant">' + n + '</div>'
          : '')
      +     '<button class="bmas" onclick="mas(\'' + p.id + '\')">+</button>'
      +   '</div>'
      + '</div></div>';
  }).join('');

  mirarFotos();
}

function esc(t){
  return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Las fotos se bajan cuando el barbero llega a ellas
function mirarFotos(){
  var faltan = false;
  document.querySelectorAll('img[data-foto]').forEach(function(im){
    if(im.src) return;
    var r = im.getBoundingClientRect();
    if(r.top < window.innerHeight + 400 && r.bottom > -400){
      var id = im.getAttribute('data-foto');
      if(FOTOS[id]) im.src = FOTOS[id];
      else faltan = true;
    }
  });
  if(faltan) bajarFotos();
}
function bajarFotos(){
  for(var i = 0; i < TROZOS; i++){
    if(_pedidos[i]) continue;
    _pedidos[i] = true;
    (function(n){
      fetch('fotos_0' + n + '.json').then(function(r){ return r.json(); })
        .then(function(g){
          for(var k in g) FOTOS[k] = g[k];
          document.querySelectorAll('img[data-foto]').forEach(function(im){
            if(!im.src && FOTOS[im.getAttribute('data-foto')])
              im.src = FOTOS[im.getAttribute('data-foto')];
          });
        }).catch(function(){ _pedidos[n] = false; });
    })(i);
  }
}
window.addEventListener('scroll', mirarFotos, { passive: true });

function verFoto(id){
  var p = PRODS.find(function(x){ return x.id === id; });
  if(!p || !p.tf || !FOTOS[id]) return;
  document.getElementById('ovImg').src = FOTOS[id];
  document.getElementById('ovPie').innerHTML = esc(p.n)
    + '<br><span style="color:#6EE7A0">Contado ' + dinero(precioContado(p.pr, p)) + '</span>'
    + '  ·  <span style="opacity:.75">Crédito ' + dinero(p.pr) + '</span>';
  document.getElementById('ovFoto').classList.add('on');
}
function cerrarFoto(){ document.getElementById('ovFoto').classList.remove('on'); }

// ═══ EL CARRITO ═══
function mas(id){ CARRO[id] = (CARRO[id]||0) + 1; guardar(); pintar(); barra(); }
function menos(id){
  CARRO[id] = (CARRO[id]||0) - 1;
  if(CARRO[id] <= 0) delete CARRO[id];
  guardar(); pintar(); barra();
}
function totales(){
  var n = 0, contado = 0, credito = 0;
  for(var k in CARRO){
    // 📦 Los combos llevan su propio precio, igual al contado que a crédito
    if(k.indexOf('COMBO:') === 0){
      var c = COMBOS[parseInt(k.split(':')[1], 10)];
      if(!c) continue;
      n += CARRO[k];
      contado += c.precio * CARRO[k];
      credito += c.precio * CARRO[k];
      continue;
    }
    var p = PRODS.find(function(x){ return x.id === k; });
    if(!p) continue;
    n += CARRO[k];
    contado += conPromo(p, CARRO[k]).total;
    credito += CARRO[k] * p.pr;
  }
  return { n: n, contado: Math.round(contado*100)/100,
           credito: Math.round(credito*100)/100,
           ahorro: Math.round((credito - contado)*100)/100 };
}
function barra(){
  var t = totales();
  var b = document.getElementById('barra');
  if(t.n > 0){
    b.classList.add('on');
    document.getElementById('bt1').textContent = t.n + (t.n===1?' producto':' productos');
    document.getElementById('bt2').textContent = dinero(t.contado) + ' al contado';
    document.getElementById('bt3').textContent = 'A crédito ' + dinero(t.credito)
      + '  ·  ahorras ' + dinero(t.ahorro);
  } else b.classList.remove('on');
}
function guardar(){ try{ localStorage.setItem('nbs_carro2', JSON.stringify(CARRO)); }catch(e){} }
function cargarCarrito(){
  try{ CARRO = JSON.parse(localStorage.getItem('nbs_carro2') || '{}'); pintar(); barra(); }
  catch(e){ CARRO = {}; }
}

// ⚡ ¿Le falta poco para una promoción? Se lo decimos: es lo que más convierte.
function empujones(){
  var out = [];
  for(var k in CARRO){
    var p = PRODS.find(function(x){ return x.id === k; });
    if(!p || !p.promo) continue;
    var n = CARRO[k];
    if(p.promo.tipo === 'cantidad'){
      if(n < p.promo.desde && n >= Math.max(1, p.promo.desde - 3)){
        var faltan = p.promo.desde - n;
        var ahorro = Math.round((precioContado(p.pr, p) - p.promo.precio) * p.promo.desde * 100) / 100;
        out.push({ id: k, n: p.n, faltan: faltan, ahorro: ahorro, frase: textoPromo(p) });
      }
    } else if(p.promo.tipo === 'lleva'){
      var resto = n % p.promo.lleva;
      if(resto > 0 && resto >= p.promo.lleva - 2){
        var f2 = p.promo.lleva - resto;
        var unit = precioContado(p.pr, p);
        var ah2 = Math.round(unit * (p.promo.lleva - p.promo.paga) * 100) / 100;
        out.push({ id: k, n: p.n, faltan: f2, ahorro: ah2, frase: textoPromo(p) });
      }
    }
  }
  return out;
}

function verCarrito(){
  var items = [], t = totales();
  for(var k in CARRO){
    if(k.indexOf('COMBO:') === 0){
      var cb = COMBOS[parseInt(k.split(':')[1], 10)];
      if(cb) items.push({ combo: cb, id: k, n: CARRO[k] });
      continue;
    }
    var p = PRODS.find(function(x){ return x.id === k; });
    if(p) items.push({ p: p, n: CARRO[k] });
  }
  if(!items.length) return;
  document.getElementById('carcaja').innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    +   '<div style="font-size:17px;font-weight:900">🛒 Tu pedido</div>'
    +   '<button onclick="cerrarCarrito()" style="background:#F0F0F6;border:none;'
    +     'border-radius:9px;width:34px;height:34px;font-size:16px;cursor:pointer">✕</button></div>'
    + items.map(function(x){
        if(x.combo){
          return '<div class="cl"><div style="flex:1;min-width:0">'
            + '<div style="font-size:13px;font-weight:800;color:#6A1B9A">📦 '
            +   esc(x.combo.nombre) + '</div>'
            + '<div style="font-size:11px;color:#8A8B9E">' + x.n + ' × '
            +   dinero(x.combo.precio) + '</div></div>'
            + '<div style="font-weight:900;font-size:14px;color:#6A1B9A">'
            +   dinero(x.n * x.combo.precio) + '</div>'
            + '<button class="bmen" onclick="menos(\'' + x.id + '\');verCarrito()">−</button></div>';
        }
        return '<div class="cl"><div style="flex:1;min-width:0">'
          + '<div style="font-size:13px;font-weight:700">' + esc(x.p.n) + '</div>'
          + '<div style="font-size:11px;color:#8A8B9E">' + x.n + ' × '
          +   dinero(precioContado(x.p.pr, x.p)) + ' contado</div></div>'
          + '<div style="font-weight:900;font-size:14px;color:#0B7A3B">'
          +   dinero(conPromo(x.p, x.n).total) + '</div>'
          + '<button class="bmen" onclick="menos(\'' + x.p.id + '\');verCarrito()">−</button></div>';
      }).join('')

    // ⚡ EL EMPUJÓN: "ponle 2 más y te salen a..."
    + empujones().map(function(e){
        return '<div onclick="sumarHasta(\'' + e.id + '\',' + e.faltan + ')" '
          + 'style="background:linear-gradient(135deg,#FFF3E0,#FFE0B2);'
          + 'border:2px solid #FF9800;border-radius:11px;padding:11px;margin-top:11px;'
          + 'cursor:pointer">'
          + '<div style="font-size:13.5px;font-weight:900;color:#E65100">'
          +   '⚡ P\u00f3nle ' + e.faltan + ' m\u00e1s de ' + esc(e.n.slice(0,26)) + '</div>'
          + '<div style="font-size:12px;color:#7A5C00;font-weight:700;margin-top:3px">'
          +   e.frase + ' \u00b7 ahorrar\u00edas ' + dinero(e.ahorro) + '</div>'
          + '<div style="font-size:11px;color:#E65100;font-weight:800;margin-top:4px">'
          +   'Toca aqu\u00ed para agregarlas</div>'
          + '</div>';
      }).join('')

    // 🔑 LOS DOS TOTALES, para que vea lo que se ahorra
    + '<div style="border:2px solid #0B7A3B;border-radius:12px;padding:13px;margin-top:14px">'
    +   '<div style="display:flex;justify-content:space-between;font-size:19px;font-weight:900;'
    +     'color:#0B7A3B"><span>💵 AL CONTADO</span><span>' + dinero(t.contado) + '</span></div>'
    +   '<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;'
    +     'color:#7C7D90;margin-top:6px"><span>A crédito</span><span>' + dinero(t.credito) + '</span></div>'
    +   '<div style="background:#E7F6ED;border-radius:8px;padding:8px;margin-top:9px;'
    +     'text-align:center;font-size:13px;font-weight:800;color:#0B7A3B">'
    +     'Pagando al contado ahorras ' + dinero(t.ahorro) + '</div>'
    + '</div>'

    + '<button onclick="enviar()" style="width:100%;padding:15px;margin-top:13px;'
    +   'background:#0B7A3B;color:#fff;border:none;border-radius:12px;font-size:16px;'
    +   'font-weight:900;cursor:pointer">📤 Enviar mi pedido</button>'
    + '<button onclick="cerrarCarrito()" style="width:100%;padding:12px;margin-top:7px;'
    +   'background:#F0F0F6;color:#333;border:none;border-radius:10px;font-size:13.5px;'
    +   'font-weight:700;cursor:pointer">Seguir pidiendo</button>';
  document.getElementById('car').classList.add('on');
}
function cerrarCarrito(){ document.getElementById('car').classList.remove('on'); }

// Toca el empujón y se le agregan las que le faltan, de un golpe
// 📦 Pedir un combo: entra al carrito como UN BLOQUE con su precio, no suelto.
function pedirCombo(i){
  var c = COMBOS[i];
  if(!c) return;
  CARRO['COMBO:' + i] = (CARRO['COMBO:' + i] || 0) + 1;
  guardar(); pintar(); barra();
  alert('📦 ' + c.nombre + ' agregado.\n\n' + dinero(c.precio));
}

function sumarHasta(id, cuantas){
  CARRO[id] = (CARRO[id] || 0) + cuantas;
  guardar(); pintar(); barra(); verCarrito();
}

function enviar(){
  var t = totales(), lineas = [];
  for(var k in CARRO){
    // 📦 Los combos van con su nombre y lo que llevan dentro
    if(k.indexOf('COMBO:') === 0){
      var cb = COMBOS[parseInt(k.split(':')[1], 10)];
      if(!cb) continue;
      lineas.push(CARRO[k] + ' × PACK ' + cb.nombre + '   ' + dinero(CARRO[k] * cb.precio));
      cb.items.forEach(function(it){
        var p2 = PRODS.find(function(x){ return x.id === it.id; });
        if(p2) lineas.push('     - ' + (it.cant > 1 ? it.cant + ' ' : '') + p2.n);
      });
      continue;
    }
    var p = PRODS.find(function(x){ return x.id === k; });
    if(!p) continue;
    lineas.push(CARRO[k] + ' × ' + p.n + '   ' + dinero(conPromo(p, CARRO[k]).total));
  }
  if(!lineas.length) return;

  var m = ['*PEDIDO NBS*', ''];
  if(YO){ m.push(YO.n); if(YO.neg) m.push(YO.neg); m.push(''); }
  m = m.concat(lineas);
  m.push('');
  m.push('TOTAL AL CONTADO: ' + dinero(t.contado));
  m.push('Total a credito: ' + dinero(t.credito));
  m.push('(al contado ahorras ' + dinero(t.ahorro) + ')');

  CARRO = {}; guardar(); pintar(); barra(); cerrarCarrito();
  location.href = 'https://wa.me/' + WHATSAPP_NBS + '?text=' + encodeURIComponent(m.join('\n'));
}
