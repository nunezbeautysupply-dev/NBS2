<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest-admin.json">
<link rel="apple-touch-icon" href="icono-admin-192.png">
<link rel="icon" href="icono-admin-192.png">
<meta name="theme-color" content="#1a237e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NBS · Administrar catálogo</title>
<!--
  🔧 ADMINISTRAR EL CATÁLOGO  (11 sep 2026)

  Sensei: "necesito poder agregar y quitar productos, así como también poder cambiar
  todo en ese catálogo".

  🔑 LOS CAMBIOS SE GUARDAN EN UN ARCHIVO que él baja y sube a GitHub. Eligió esa vía
  a propósito: NO toca Firebase ni su sesión — eso fue lo que le dañó la huella.

  Esta pantalla es SUYA: el barbero nunca la abre.
-->
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
       background:#F2F3F7;color:#151628;padding-bottom:120px}
  .cab{background:#1a237e;color:#fff;padding:13px 14px;position:sticky;top:0;z-index:50;
       box-shadow:0 2px 12px rgba(0,0,0,.2)}
  .cab h1{margin:0;font-size:16px;font-weight:900}
  .cab .sub{font-size:12px;color:#BFC6F0;font-weight:700;margin-top:2px}

  .ajustes{background:#fff;padding:12px 14px;border-bottom:1px solid #E5E6EE}
  .ajustes .fila{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .ajustes label{font-size:12px;font-weight:800;color:#555;flex:1}
  .ajustes input{width:110px;padding:9px;border:1.5px solid #ccc;border-radius:8px;
                 font-size:14px;font-weight:800;text-align:center}
  .ajustes .ancho{width:100%;text-align:left}

  .buscar{width:100%;padding:11px 13px;border:1.5px solid #ccc;border-radius:10px;
          font-size:15px;margin:10px 0 8px}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px 13px;border-radius:20px;border:1.5px solid #D4D5E0;
        background:#fff;font-size:12px;font-weight:700;color:#555;cursor:pointer;white-space:nowrap}
  .chip.on{background:#1a237e;color:#fff;border-color:#1a237e}

  .lista{padding:0 10px}
  .p{display:flex;gap:10px;background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;
     box-shadow:0 1px 3px rgba(0,0,0,.06);align-items:center}
  .p.oculto{opacity:.5;background:#F6F6FA}
  .fo{width:60px;height:60px;border-radius:9px;background:#EDEEF4;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;overflow:hidden}
  .fo img{width:100%;height:100%;object-fit:cover}
  .fo .sinf{font-size:8.5px;color:#9899AC;text-align:center;font-weight:800;line-height:1.3}
  .inf{flex:1;min-width:0}
  .nom{font-size:13px;font-weight:800;line-height:1.25}
  .mar{font-size:10.5px;color:#8A8B9E;font-weight:700;margin-top:1px}
  .pre{font-size:12px;font-weight:800;margin-top:3px}
  .pre .c{color:#0B7A3B}
  .pre .n{color:#8A8B9E;font-weight:600}
  .bot{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
  .bot button{width:34px;height:31px;border-radius:8px;border:1.5px solid #D4D5E0;
              background:#fff;font-size:14px;cursor:pointer;padding:0}
  .bot .ver{border-color:#1a237e}
  .bot .del{border-color:#C62828;background:#FFF5F5}

  .pie{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:10px 12px;
       box-shadow:0 -3px 14px rgba(0,0,0,.14);z-index:60;display:flex;gap:8px}
  .pie button{flex:1;padding:13px 6px;border:none;border-radius:11px;font-size:13.5px;
              font-weight:900;cursor:pointer}
  .pie .add{background:#fff;color:#1a237e;border:1.5px solid #1a237e}
  .pie .save{background:#0B7A3B;color:#fff}

  .ov{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:200;display:none;
      align-items:center;justify-content:center;padding:14px}
  .ov.on{display:flex}
  .caja{background:#fff;border-radius:15px;padding:16px;max-width:420px;width:100%;
        max-height:90vh;overflow:auto}
  .caja h2{margin:0 0 12px;font-size:16px;font-weight:900;color:#1a237e;
           display:flex;justify-content:space-between;align-items:center}
  .caja .et{font-size:10.5px;font-weight:800;color:#555;letter-spacing:.3px;margin-top:9px}
  .caja input{width:100%;padding:11px;border:1.5px solid #ccc;border-radius:9px;
              font-size:15px;margin-top:3px}
  .caja .btns{display:flex;gap:8px;margin-top:14px}
  .caja .btns button{flex:1;padding:13px;border:none;border-radius:11px;
                     font-size:14px;font-weight:900;cursor:pointer}
  .caja .ok{background:#0B7A3B;color:#fff}
  .caja .no{background:#F0F0F6;color:#444}
  .vacio{text-align:center;padding:40px 20px;color:#9899AC;font-size:14px;line-height:1.6}
  .aviso{background:#FFF8E1;border:1.5px solid #FFD54F;border-radius:10px;padding:10px;
         font-size:12px;color:#6D4C00;line-height:1.5;margin:10px}
</style>
</head>
<body>

<div class="cab">
  <h1>🔧 ADMINISTRAR CATÁLOGO</h1>
  <div class="sub" id="cuenta">Cargando…</div>
</div>

<div class="ajustes">
  <div class="fila">
    <label>💵 Descuento al contado</label>
    <input type="number" id="desc" min="0" max="50" step="1" onchange="cambiarDesc(this.value)">
  </div>
  <div class="fila">
    <label>📱 Tu WhatsApp</label>
  </div>
  <input class="ancho" id="wa" placeholder="14013050188" onchange="cambiarWa(this.value)"
         style="width:100%;padding:9px;border:1.5px solid #ccc;border-radius:8px;font-size:14px">

  <input class="buscar" id="q" placeholder="🔍 Buscar producto…" oninput="buscar(this.value)">
  <div class="chips" id="chips"></div>
</div>

<div id="avisoCambios"></div>
<div class="lista" id="lista"><div class="vacio">Cargando…</div></div>

<div class="pie">
  <button class="add" onclick="abrirNuevo()">➕ Producto</button>
  <button class="add" onclick="abrirCombos()" style="border-color:#6A1B9A;color:#6A1B9A">📦 Packs</button>
  <button class="add" onclick="abrirCargaLotes()" style="border-color:#0B7A3B;color:#0B7A3B">📸 Fotos</button>
  <button class="save" onclick="guardarTodo()">💾 Guardar</button>
</div>

<div class="ov" id="ovCombos"><div class="caja" id="cajaCombos" style="max-width:460px"></div></div>
<div class="ov" id="ovLotes"><div class="caja" id="cajaLotes" style="max-width:460px"></div></div>

<div class="ov" id="ovEdit"><div class="caja" id="cajaEdit"></div></div>

<script>
var PRODS = [], CLIENTES = [], FOTOS = {}, CAMBIOS = false, COMBOS = [];
var FILTRO = 'todos', BUSCA = '';
var AJUSTES = { descuento: 10, whatsapp: '14013050188' };

function dinero(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }
// Cada producto puede tener SU descuento. Si no, usa el general.
function contado(pr, p){
  var d = (p && typeof p.desc === 'number') ? p.desc : AJUSTES.descuento;
  return Math.round(pr * (1 - d/100) * 100) / 100;
}
// 📊 Cuanta ganancia le queda con ese descuento. Es lo que decide si puede darlo.
function margenCon(p, desc){
  var pr = p.pr, co = p.co || 0;
  if(!pr || !co) return null;
  var venta = pr * (1 - desc/100);
  return Math.round((venta - co) / venta * 100);
}
function textoPromo(p){
  if(!p.promo) return '';
  if(p.promo.tipo === 'lleva') return '🎁 Lleva ' + p.promo.lleva + ' paga ' + p.promo.paga;
  return '🎁 Desde ' + p.promo.desde + ' a $' + p.promo.precio.toFixed(2);
}
function esc(t){ return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Cargar todo ──
Promise.all([
  fetch('productos.json').then(function(r){ return r.json(); }),
  fetch('fotos_00.json').then(function(r){ return r.json(); }).catch(function(){ return {}; }),
  fetch('fotos_01.json').then(function(r){ return r.json(); }).catch(function(){ return {}; }),
  fetch('fotos_02.json').then(function(r){ return r.json(); }).catch(function(){ return {}; })
]).then(function(x){
  PRODS = x[0].productos || [];
  CLIENTES = x[0].clientes || [];
  if(x[0].ajustes) AJUSTES = x[0].ajustes;
  COMBOS = x[0].combos || [];
  for(var i = 1; i < x.length; i++) for(var k in x[i]) FOTOS[k] = x[i][k];
  document.getElementById('desc').value = AJUSTES.descuento;
  document.getElementById('wa').value = AJUSTES.whatsapp;
  pintarChips();
  pintar();
}).catch(function(e){
  document.getElementById('lista').innerHTML =
    '<div class="vacio">No pude cargar el catálogo.<br>' + esc(e.message) + '</div>';
});

var FILTROS = [
  ['todos','Todos'], ['promo','🎁 Con promo'], ['oferta','🔥 En oferta'],
  ['dormidos','💀 Dormidos'], ['ocultos','Ocultos'], ['sinfoto','Sin foto']
];
function pintarChips(){
  document.getElementById('chips').innerHTML = FILTROS.map(function(f){
    return '<div class="chip' + (FILTRO===f[0]?' on':'') + '" onclick="filtrar(\'' + f[0] + '\')">'
      + f[1] + '</div>';
  }).join('');
}
function filtrar(k){ FILTRO = k; pintarChips(); pintar(); }
function buscar(v){ BUSCA = v; pintar(); }

function pasaFiltro(p){
  if(FILTRO === 'promo') return !!p.promo;
  if(FILTRO === 'oferta') return !!p.oferta;
  if(FILTRO === 'dormidos') return !!p.dormido;   // 💀 con stock y sin venderse
  if(FILTRO === 'ocultos') return !!p.oculto;
  if(FILTRO === 'sinfoto') return !p.tf;
  return true;
}

function pintar(){
  var q = (BUSCA||'').toLowerCase().trim();
  var lista = PRODS.filter(function(p){
    if(!pasaFiltro(p)) return false;
    if(!q) return true;
    return ((p.n||'') + ' ' + (p.m||'')).toLowerCase().indexOf(q) >= 0;
  });

  var visibles = PRODS.filter(function(p){ return !p.oculto; }).length;
  var conFoto = PRODS.filter(function(p){ return p.tf; }).length;
  document.getElementById('cuenta').textContent =
    PRODS.length + ' productos · ' + visibles + ' visibles · ' + conFoto + ' con foto';

  document.getElementById('avisoCambios').innerHTML = CAMBIOS
    ? '<div class="aviso">⚠️ Tienes cambios sin guardar. Toca <b>💾 Guardar cambios</b> '
      + 'abajo y sube el archivo que se baje.</div>' : '';

  if(!lista.length){
    document.getElementById('lista').innerHTML =
      '<div class="vacio">No hay productos con eso.</div>';
    return;
  }

  document.getElementById('lista').innerHTML = lista.map(function(p){
    var i = PRODS.indexOf(p);
    return '<div class="p' + (p.oculto ? ' oculto' : '') + '">'
      + '<div class="fo">'
      +   (p.tf && FOTOS[p.id] ? '<img src="' + FOTOS[p.id] + '">' : '<div class="sinf">SIN<br>FOTO</div>')
      + '</div>'
      + '<div class="inf">'
      +   '<div class="nom">' + esc(p.n) + (p.oculto ? ' 🚫' : '') + '</div>'
      +   (p.m ? '<div class="mar">' + esc(p.m) + '</div>' : '')
      +   '<div class="pre"><span class="c">' + dinero(contado(p.pr, p)) + ' contado</span>'
      +     '<span class="n">  ·  ' + dinero(p.pr) + ' crédito</span>'
      +     (typeof p.desc === 'number'
            ? '<span style="color:#E65100;font-weight:900">  ·  ' + p.desc + '% suyo</span>' : '')
      +   '</div>'
      +   (p.promo ? '<div style="font-size:10px;font-weight:800;color:#E65100;margin-top:2px">'
                   + textoPromo(p) + '</div>' : '')
      +   (p.oferta ? '<div style="font-size:10px;font-weight:900;color:#C62828;margin-top:2px">'
                    + '🔥 EN OFERTA</div>' : '')
      + '</div>'
      + '<div class="bot">'
      +   '<button class="ver" onclick="verNoVer(' + i + ')" title="Mostrar u ocultar">'
      +     (p.oculto ? '🙈' : '👁️') + '</button>'
      +   '<button onclick="abrirEditar(' + i + ')" title="Cambiar">✏️</button>'
      +   '<button class="del" onclick="quitar(' + i + ')" title="Quitar">🗑️</button>'
      + '</div></div>';
  }).join('');
}

// ── 👁️ Ocultar o mostrar ──
function verNoVer(i){
  PRODS[i].oculto = !PRODS[i].oculto;
  CAMBIOS = true;
  pintar();
}

// ── 🗑️ Quitar del catálogo ──
function quitar(i){
  var p = PRODS[i];
  if(!confirm('¿Quitar "' + p.n + '" del catálogo?\n\nSi solo quieres que el barbero no lo '
    + 'vea por ahora, usa el ojo 👁️ en vez de quitarlo.')) return;
  PRODS.splice(i, 1);
  CAMBIOS = true;
  pintar();
}

// ── ✏️ Cambiar ──
function abrirEditar(i){
  var p = PRODS[i];
  window._editando = i;
  document.getElementById('cajaEdit').innerHTML =
      '<h2>✏️ Cambiar producto <button onclick="cerrarEdit()" style="background:#F0F0F6;'
    +   'border:none;border-radius:8px;width:32px;height:32px;font-size:15px;cursor:pointer">✕</button></h2>'
    + '<div style="display:flex;gap:11px;align-items:center;margin-bottom:6px">'
    +   '<div style="width:82px;height:82px;border-radius:10px;background:#EDEEF4;'
    +     'overflow:hidden;display:flex;align-items:center;justify-content:center" id="prevFoto">'
    +     (p.tf && FOTOS[p.id]
          ? '<img src="' + FOTOS[p.id] + '" style="width:100%;height:100%;object-fit:cover">'
          : '<span style="font-size:9px;color:#9899AC;font-weight:800;text-align:center">SIN<br>FOTO</span>')
    +   '</div>'
    +   '<div style="flex:1">'
    +     '<input type="file" accept="image/*" id="fArch" style="display:none" onchange="ponerFoto(event)">'
    +     '<button onclick="document.getElementById(\'fArch\').click()" style="width:100%;'
    +       'padding:10px;background:#1a237e;color:#fff;border:none;border-radius:9px;'
    +       'font-size:12.5px;font-weight:800;cursor:pointer">📷 Cambiar foto</button>'
    +     (p.tf ? '<button onclick="quitarFoto()" style="width:100%;padding:9px;margin-top:6px;'
                + 'background:#FFF5F5;color:#C62828;border:1.5px solid #C62828;border-radius:9px;'
                + 'font-size:12px;font-weight:800;cursor:pointer">🗑️ Quitar foto</button>' : '')
    +   '</div>'
    + '</div>'
    + '<div class="et">NOMBRE</div><input id="eNom" value="' + esc(p.n) + '">'
    + '<div class="et">MARCA</div><input id="eMar" value="' + esc(p.m || '') + '">'
    + '<div class="et">PRECIO NORMAL (a crédito)</div>'
    + '<input id="ePre" type="number" step="0.01" value="' + p.pr + '" oninput="verContado()">'
    // 💵 SU PROPIO DESCUENTO -Sensei, 11 sep: "no puedo darle el mismo a todos"-
    + '<div style="background:#F4F6FB;border-radius:10px;padding:11px;margin-top:11px">'
    +   '<div style="font-size:11px;font-weight:900;color:#1a237e;margin-bottom:7px">'
    +     '💵 DESCUENTO AL CONTADO</div>'
    +   '<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700">'
    +     '<input type="radio" name="td" ' + (typeof p.desc !== 'number' ? 'checked' : '')
    +     ' onchange="usarGeneral()"> Usar el general (' + AJUSTES.descuento + '%)</label>'
    +   '<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;'
    +     'margin-top:7px"><input type="radio" name="td" '
    +     (typeof p.desc === 'number' ? 'checked' : '') + ' onchange="usarPropio()"> Solo para este:'
    +     '<input id="eDesc" type="number" min="0" max="60" style="width:70px;padding:7px;'
    +       'border:1.5px solid #ccc;border-radius:7px;text-align:center;font-weight:800;margin:0"'
    +       ' value="' + (typeof p.desc === 'number' ? p.desc : AJUSTES.descuento) + '"'
    +       ' oninput="verContado()"> %</label>'
    + '</div>'
    + '<div id="avisoContado" style="background:#E7F6ED;border-radius:9px;padding:10px;'
    +   'margin-top:9px;text-align:center;font-size:13px;font-weight:800;color:#0B7A3B"></div>'

    // 🎁 LA PROMOCIÓN
    + '<div style="background:#FFF8E1;border-radius:10px;padding:11px;margin-top:10px">'
    +   '<div style="font-size:11px;font-weight:900;color:#E65100;margin-bottom:7px">'
    +     '🎁 PROMOCIÓN</div>'
    +   '<select id="ePromo" onchange="cambiarTipoPromo()" style="width:100%;padding:9px;'
    +     'border:1.5px solid #E0C070;border-radius:8px;font-size:13px;font-weight:700">'
    +     '<option value="">Sin promoción</option>'
    +     '<option value="lleva"' + (p.promo && p.promo.tipo==='lleva' ? ' selected':'') + '>'
    +       'Lleva varios y paga menos</option>'
    +     '<option value="cantidad"' + (p.promo && p.promo.tipo==='cantidad' ? ' selected':'') + '>'
    +       'Desde X unidades, otro precio</option>'
    +   '</select>'
    +   '<div id="camposPromo" style="margin-top:9px"></div>'
    + '</div>'

    // 🔥 EN OFERTA
    + '<label style="display:flex;align-items:center;gap:9px;background:#FFEBEE;'
    +   'border-radius:10px;padding:11px;margin-top:10px;font-size:13px;font-weight:800;'
    +   'color:#C62828;cursor:pointer">'
    +   '<input type="checkbox" id="eOferta" ' + (p.oferta ? 'checked' : '')
    +   ' style="width:20px;height:20px"> 🔥 Ponerlo en OFERTAS'
    +   (p.dormido ? '<span style="font-size:10.5px;font-weight:700;opacity:.8">'
                   + '(lleva 60 días sin venderse)</span>' : '')
    + '</label>'

    + '<div class="btns"><button class="ok" onclick="guardarEdit()">✓ Guardar</button>'
    +   '<button class="no" onclick="cerrarEdit()">Cancelar</button></div>';
  cambiarTipoPromo();
  var sel0 = document.getElementById('ePromo');
  if(sel0 && sel0.value === 'lleva') sugerirFraseLleva();
  else if(sel0 && sel0.value === 'cantidad') sugerirFrase();
  verContado();
  document.getElementById('ovEdit').classList.add('on');
}

function usarGeneral(){ window._descPropio = false; verContado(); }
function usarPropio(){ window._descPropio = true; verContado(); }

// 📊 Le dice cuánta ganancia le queda con ese descuento. Es lo que decide si puede darlo.
function verContado(){
  var i = window._editando;
  var p = (i !== undefined && i !== null && PRODS[i]) ? PRODS[i] : { co: 0 };
  var pr = parseFloat(document.getElementById('ePre').value) || 0;
  var elDesc = document.getElementById('eDesc');
  var propio = window._descPropio;
  if(propio === undefined) propio = (typeof p.desc === 'number');
  var d = propio && elDesc ? (parseFloat(elDesc.value) || 0) : AJUSTES.descuento;
  var venta = Math.round(pr * (1 - d/100) * 100) / 100;
  var co = p.co || 0;
  var m = (venta > 0 && co > 0) ? Math.round((venta - co) / venta * 100) : null;

  var caja = document.getElementById('avisoContado');
  if(!caja) return;
  var txt = '💵 Al contado: <b>' + dinero(venta) + '</b>';
  if(m !== null){
    // 🔑 El aviso: si le queda poca ganancia, en rojo
    var col = m < 20 ? '#C62828' : (m < 30 ? '#E65100' : '#0B7A3B');
    var cara = m < 20 ? '⚠️' : (m < 30 ? '🟠' : '✅');
    txt += '<br><span style="color:' + col + '">📊 Te queda <b>' + m
         + '%</b> de ganancia ' + cara + '</span>';
    if(m < 20) txt += '<br><span style="font-size:11px;color:#C62828">'
         + 'Es muy poco. Baja el descuento.</span>';
    caja.style.background = m < 20 ? '#FFEBEE' : (m < 30 ? '#FFF3E0' : '#E7F6ED');
  }
  caja.innerHTML = txt;
}

// 🎁 Los campos de la promoción, según el tipo
function cambiarTipoPromo(){
  var sel = document.getElementById('ePromo');
  var caja = document.getElementById('camposPromo');
  if(!sel || !caja) return;
  var i = window._editando;
  var p = (i !== undefined && i !== null && PRODS[i]) ? PRODS[i] : {};
  var pm = p.promo || {};
  if(sel.value === 'lleva'){
    caja.innerHTML = '<div style="display:flex;gap:8px;align-items:center;font-size:13px;'
      + 'font-weight:700">Lleva <input id="pLleva" type="number" min="2" value="'
      + (pm.lleva || 3) + '" style="width:62px;padding:7px;border:1.5px solid #E0C070;'
      + 'border-radius:7px;text-align:center;font-weight:800;margin:0">'
      + ' y paga <input id="pPaga" type="number" min="1" value="' + (pm.paga || 2)
      + '" style="width:62px;padding:7px;border:1.5px solid #E0C070;border-radius:7px;'
      + 'text-align:center;font-weight:800;margin:0" oninput="sugerirFraseLleva()"></div>'
      + campoFrase(pm);

// 💡 Las frases que se le ofrecen, calculadas con SUS números
function sugerirFrase(){
  var caja = document.getElementById('sugerencias');
  if(!caja) return;
  var desde = parseInt((document.getElementById('pDesde')||{}).value, 10) || 0;
  var precio = parseFloat((document.getElementById('pPrecio')||{}).value) || 0;
  var i = window._editando;
  var pr = (i !== undefined && i !== null && PRODS[i]) ? PRODS[i].pr : 0;
  var ideas = [];
  if(desde > 1 && precio > 0 && pr > 0){
    // Cuántos paga de verdad: la cuenta que él no tiene que hacer
    var paga = Math.round(desde * precio / pr * 10) / 10;
    var pagaEnt = Math.round(paga);
    if(pagaEnt >= 1 && pagaEnt < desde){
      ideas.push('COMPRA ' + desde + ' Y PAGA ' + pagaEnt);
      var gratis = desde - pagaEnt;
      ideas.push('COMPRA ' + pagaEnt + ' Y LLÉVATE ' + (gratis > 1 ? gratis + ' GRATIS' : '1 GRATIS'));
    }
    var ahorro = Math.round((pr - precio) * desde * 100) / 100;
    if(ahorro > 0) ideas.push('LLEVA ' + desde + ' Y AHORRA $' + ahorro.toFixed(2));
  }
  caja.innerHTML = ideas.map(function(x){
    return '<button onclick="ponerFrase(' + JSON.stringify(x).replace(/"/g,'&quot;') + ')" '
      + 'style="padding:6px 10px;background:#fff;border:1.5px solid #FF9800;border-radius:7px;'
      + 'font-size:11px;font-weight:800;color:#E65100;cursor:pointer">' + x + '</button>';
  }).join('');
  verFrase();
}

function sugerirFraseLleva(){
  var caja = document.getElementById('sugerencias');
  if(!caja) return;
  var lv = parseInt((document.getElementById('pLleva')||{}).value, 10) || 0;
  var pg = parseInt((document.getElementById('pPaga')||{}).value, 10) || 0;
  var ideas = [];
  if(lv > pg && pg >= 1){
    ideas.push('COMPRA ' + lv + ' Y PAGA ' + pg);
    var gratis = lv - pg;
    ideas.push('COMPRA ' + pg + ' Y LLÉVATE ' + (gratis > 1 ? gratis + ' GRATIS' : '1 GRATIS'));
  }
  caja.innerHTML = ideas.map(function(x){
    return '<button onclick="ponerFrase(' + JSON.stringify(x).replace(/"/g,'&quot;') + ')" '
      + 'style="padding:6px 10px;background:#fff;border:1.5px solid #FF9800;border-radius:7px;'
      + 'font-size:11px;font-weight:800;color:#E65100;cursor:pointer">' + x + '</button>';
  }).join('');
  verFrase();
}

function ponerFrase(t){
  var e = document.getElementById('pFrase');
  if(e){ e.value = t; verFrase(); }
}

function verFrase(){
  var e = document.getElementById('pFrase');
  var v = document.getElementById('verFrase');
  if(!e || !v) return;
  var t = (e.value || '').trim();
  if(!t){
    // Si no escribe nada, se calcula sola: nunca queda vacío
    var desde = parseInt((document.getElementById('pDesde')||{}).value, 10) || 0;
    var precio = parseFloat((document.getElementById('pPrecio')||{}).value) || 0;
    var i = window._editando;
    var pr = (i !== undefined && i !== null && PRODS[i]) ? PRODS[i].pr : 0;
    if(desde > 1 && precio > 0 && pr > 0){
      var paga = Math.round(desde * precio / pr);
      if(paga >= 1 && paga < desde) t = 'COMPRA ' + desde + ' Y PAGA ' + paga;
    }
  }
  v.textContent = '🎁 ' + (t || '(escribe tu frase)');
}

// ── 📷 La foto: se achica antes de guardar, para que no pese ──
function ponerFoto(ev){
  var f = ev.target.files && ev.target.files[0];
  if(!f) return;
  var lector = new FileReader();
  lector.onload = function(e){
    var img = new Image();
    img.onload = function(){
      // Máximo 520px de lado: se ve bien y pesa poco
      var max = 520, w = img.width, h = img.height;
      if(w > h && w > max){ h = Math.round(h * max / w); w = max; }
      else if(h > max){ w = Math.round(w * max / h); h = max; }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      var data = c.toDataURL('image/jpeg', 0.72);
      var i = window._editando;
      var id = window._nuevo ? window._idNuevo : PRODS[i].id;
      FOTOS[id] = data;
      if(!window._nuevo) PRODS[i].tf = true;
      else window._fotoNueva = data;
      document.getElementById('prevFoto').innerHTML =
        '<img src="' + data + '" style="width:100%;height:100%;object-fit:cover">';
      CAMBIOS = true;
    };
    img.src = e.target.result;
  };
  lector.readAsDataURL(f);
  ev.target.value = '';
}

function quitarFoto(){
  var i = window._editando;
  if(i === undefined || i === null) return;
  delete FOTOS[PRODS[i].id];
  PRODS[i].tf = false;

  document.getElementById('prevFoto').innerHTML =

}

// ═══════════════════════════════════════════════════════════════════
//  ✨ LIMPIAR LAS FOTOS  (12 sep 2026)
//
//  Sensei: "una herramienta que recorte y limpie mis propias fotos automáticamente —
//  que quite el fondo y las deje todas iguales, como de catálogo".
//
//  🔑 TODO PASA EN SU TELÉFONO/PC. No sube nada a ningún sitio, no depende de ningún
//  servicio de pago, y funciona sin internet.
//
//  QUÉ HACE CON CADA FOTO:
//    ① Busca dónde está el producto y recorta lo que sobra
//    ② Lo centra en un cuadrado
//    ③ Pone fondo blanco limpio
//    ④ Sube un poco el contraste y el brillo
//  Así todas quedan iguales, como de catálogo.
// ═══════════════════════════════════════════════════════════════════

// 🔑 Encuentra el producto: mira el color de las esquinas -que es el fondo- y busca
// hasta dónde llega lo que NO se parece a ese color.
function _dondeEstaElProducto(datos, W, H){
  function color(x, y){
    var i = (y * W + x) * 4;
    return [datos[i], datos[i+1], datos[i+2]];
  }
  // El fondo: el promedio de las cuatro esquinas
  var esq = [color(2,2), color(W-3,2), color(2,H-3), color(W-3,H-3)];
  var fr = 0, fg = 0, fb = 0;
  esq.forEach(function(c){ fr += c[0]; fg += c[1]; fb += c[2]; });
  fr /= 4; fg /= 4; fb /= 4;

  var UMBRAL = 42;          // cuánto tiene que diferenciarse para contar como producto
  var x1 = W, y1 = H, x2 = 0, y2 = 0, hallados = 0;
  var salto = Math.max(1, Math.floor(Math.min(W, H) / 220));   // no hace falta mirar todo

  for(var y = 0; y < H; y += salto){
    for(var x = 0; x < W; x += salto){
      var c = color(x, y);
      var dif = Math.abs(c[0]-fr) + Math.abs(c[1]-fg) + Math.abs(c[2]-fb);
      if(dif > UMBRAL){
        hallados++;
        if(x < x1) x1 = x;
        if(x > x2) x2 = x;
        if(y < y1) y1 = y;
        if(y > y2) y2 = y;
      }
    }
  }
  // Si no encontró nada claro, se deja la foto entera
  if(hallados < 40 || x2 <= x1 || y2 <= y1) return { x: 0, y: 0, w: W, h: H, seguro: false };
  // Un margen alrededor, para no cortar al ras
  var m = Math.round(Math.max(x2-x1, y2-y1) * 0.08);
  x1 = Math.max(0, x1 - m); y1 = Math.max(0, y1 - m);
  x2 = Math.min(W, x2 + m); y2 = Math.min(H, y2 + m);
  return { x: x1, y: y1, w: x2-x1, h: y2-y1, seguro: true };
}

/**
 * ✨ Limpia una foto: recorta, centra en cuadrado, fondo blanco y realce.
 * Devuelve la imagen lista para guardar.
 */
function limpiarFoto(dataUrl, listo, opciones){
  opciones = opciones || {};
  var LADO = opciones.lado || 600;
  var img = new Image();
  img.onload = function(){
    try {
      // Se mira la foto a tamaño manejable, para que vaya rápido
      var W = img.width, H = img.height;
      var esc = Math.min(1, 700 / Math.max(W, H));
      var aw = Math.round(W * esc), ah = Math.round(H * esc);
      var c1 = document.createElement('canvas');
      c1.width = aw; c1.height = ah;
      var x1 = c1.getContext('2d', { willReadFrequently: true });
      x1.drawImage(img, 0, 0, aw, ah);
      var datos = x1.getImageData(0, 0, aw, ah).data;

      var r = opciones.recortar === false
        ? { x: 0, y: 0, w: aw, h: ah, seguro: false }
        : _dondeEstaElProducto(datos, aw, ah);

      // Se pasa el recorte a las medidas de la foto original
      var rx = Math.round(r.x / esc), ry = Math.round(r.y / esc);
      var rw = Math.round(r.w / esc), rh = Math.round(r.h / esc);

      // El lienzo final: cuadrado y blanco
      var c2 = document.createElement('canvas');
      c2.width = LADO; c2.height = LADO;
      var x2 = c2.getContext('2d');
      x2.fillStyle = opciones.fondo || '#ffffff';
      x2.fillRect(0, 0, LADO, LADO);

      // El producto, centrado y sin deformar
      var margen = Math.round(LADO * 0.06);
      var cabe = LADO - margen * 2;
      var f = Math.min(cabe / rw, cabe / rh);
      var dw = Math.round(rw * f), dh = Math.round(rh * f);
      var dx = Math.round((LADO - dw) / 2), dy = Math.round((LADO - dh) / 2);
      x2.imageSmoothingQuality = 'high';
      x2.drawImage(img, rx, ry, rw, rh, dx, dy, dw, dh);

      // 🧹 QUITAR EL FONDO: lo que se parece al color de las esquinas se vuelve blanco.
      // Así el producto queda sobre blanco limpio, no sobre el mostrador. -12 sep-
      if(opciones.quitarFondo !== false){
        var imf = x2.getImageData(0, 0, LADO, LADO);
        var pf = imf.data;
        // El color del fondo: las esquinas del recorte ya pegado
        function px(xx, yy){ var i = (yy*LADO+xx)*4; return [pf[i],pf[i+1],pf[i+2]]; }
        var muestras = [px(dx+3,dy+3), px(dx+dw-4,dy+3), px(dx+3,dy+dh-4), px(dx+dw-4,dy+dh-4),
                        px(dx+Math.round(dw/2),dy+2), px(dx+2,dy+Math.round(dh/2))];
        var fr2=0, fg2=0, fb2=0;
        muestras.forEach(function(c){ fr2+=c[0]; fg2+=c[1]; fb2+=c[2]; });
        fr2/=muestras.length; fg2/=muestras.length; fb2/=muestras.length;

        // Solo si el fondo NO es ya casi blanco: si lo es, no hay nada que quitar
        if(!(fr2 > 232 && fg2 > 232 && fb2 > 232)){
          var TOL = 58;
          for(var k = 0; k < pf.length; k += 4){
            var dd = Math.abs(pf[k]-fr2) + Math.abs(pf[k+1]-fg2) + Math.abs(pf[k+2]-fb2);
            if(dd < TOL){ pf[k] = 255; pf[k+1] = 255; pf[k+2] = 255; }
            else if(dd < TOL * 1.9){
              // Borde: se mezcla con blanco para que no quede recortado a cuchillo
              var m2 = (dd - TOL) / (TOL * 0.9);
              pf[k]   = Math.round(pf[k]   * m2 + 255 * (1-m2));
              pf[k+1] = Math.round(pf[k+1] * m2 + 255 * (1-m2));
              pf[k+2] = Math.round(pf[k+2] * m2 + 255 * (1-m2));
            }
          }
          x2.putImageData(imf, 0, 0);
        }
      }

      // ✨ Un poco de brillo y contraste, para que se vea de catálogo
      if(opciones.realzar !== false){
        var im2 = x2.getImageData(0, 0, LADO, LADO);
        var p = im2.data;
        var CONTRASTE = 1.14, BRILLO = 8;
        for(var i = 0; i < p.length; i += 4){
          p[i]   = Math.min(255, Math.max(0, (p[i]   - 128) * CONTRASTE + 128 + BRILLO));
          p[i+1] = Math.min(255, Math.max(0, (p[i+1] - 128) * CONTRASTE + 128 + BRILLO));
          p[i+2] = Math.min(255, Math.max(0, (p[i+2] - 128) * CONTRASTE + 128 + BRILLO));
        }
        x2.putImageData(im2, 0, 0);
      }

      listo(c2.toDataURL('image/jpeg', 0.82), r.seguro);
    } catch(e){
      console.warn('no pude limpiar la foto:', e);
      listo(dataUrl, false);        // si algo falla, se deja la original
    }
  };
  img.onerror = function(){ listo(dataUrl, false); };
  img.src = dataUrl;
}

// Quita tildes, marcas y palabras de relleno: así "Level3 Guante mediano negro" y
// "level3-guante-mediano-negro.jpg" se reconocen como lo mismo.
function _limpiar(t){
  return String(t || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\.(jpe?g|png|webp|gif|heic)$/i, '')
    .replace(/[_\-\.]+/g, ' ')
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// 🔑 Cuánto se parecen dos nombres, de 0 a 100. Cuenta las palabras que comparten,
// dando más peso a las largas —"keratin" dice más que "de"—.
function _parecido(a, b){
  var pa = _limpiar(a).split(' ').filter(function(x){ return x.length > 1; });
  var pb = _limpiar(b).split(' ').filter(function(x){ return x.length > 1; });
  if(!pa.length || !pb.length) return 0;
  var peso = 0, total = 0;
  pa.forEach(function(w){
    var v = w.length >= 5 ? 3 : (w.length >= 3 ? 2 : 1);
    total += v;
    if(pb.indexOf(w) >= 0) peso += v;
    else if(pb.some(function(x){ return x.indexOf(w) === 0 || w.indexOf(x) === 0; })) peso += v * 0.6;
  });
  return Math.round(peso / total * 100);
}

function emparejarFotos(ev){
  var files = Array.prototype.slice.call(ev.target.files || []);
  if(!files.length) return;
  ev.target.value = '';

  // Se busca a qué producto se parece más cada foto
  var props = files.map(function(f){
    var mejor = null, mejorPct = 0;
    PRODS.forEach(function(p){
      var pct = _parecido(f.name, (p.m || '') + ' ' + p.n);
      if(pct > mejorPct){ mejorPct = pct; mejor = p; }
    });
    return { file: f, p: mejor, pct: mejorPct, usar: mejorPct >= 55 };
  });
  window._lotesPend = props;
  pintarEmparejadas();
}

// ✨ Achica Y LIMPIA la foto: recorta, centra en cuadrado, quita el fondo y realza.
// Así todas quedan iguales, como de catálogo, sin que Sensei toque nada. -12 sep-
function achicarFoto(file, listo){
  var lector = new FileReader();
  lector.onload = function(e){
    if(window._limpiarFotos === false){
      // Sin limpiar: solo achicar
      var img = new Image();
      img.onload = function(){
        var max = 520, w = img.width, h = img.height;
        if(w > h && w > max){ h = Math.round(h * max / w); w = max; }
        else if(h > max){ w = Math.round(w * max / h); h = max; }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        listo(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = function(){ listo(null); };
      img.src = e.target.result;
      return;
    }
    limpiarFoto(e.target.result, function(limpia){ listo(limpia); }, { lado: 560 });
  };
  lector.onerror = function(){ listo(null); };
  lector.readAsDataURL(file);
}

        var p = PRODS.find(function(x){ return x.id === it.id; });
        return a + (p ? p.pr * (it.cant || 1) : 0);
      }, 0);
      return '<div style="border:2px solid #6A1B9A;border-radius:11px;padding:11px;'
        +   'margin-bottom:9px">'
        + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
        +   '<div style="flex:1"><div style="font-size:14px;font-weight:900;color:#6A1B9A">'
        +     esc(c.nombre) + '</div>'
        +     '<div style="font-size:11px;color:#8A8B9E">' + c.items.length + ' producto(s) · '
        +       'sueltos ' + dinero(suelto) + '</div>'
        +     '<div style="font-size:17px;font-weight:900;color:#6A1B9A;margin-top:3px">'
        +       dinero(c.precio) + '</div></div>'
        +   '<div style="display:flex;flex-direction:column;gap:4px">'
        +     '<button onclick="editarCombo(' + i + ')" style="width:34px;height:31px;'
        +       'border-radius:8px;border:1.5px solid #D4D5E0;background:#fff;cursor:pointer">✏️</button>'
        +     '<button onclick="borrarCombo(' + i + ')" style="width:34px;height:31px;'
        +       'border-radius:8px;border:1.5px solid #C62828;background:#FFF5F5;cursor:pointer">🗑️</button>'
        +   '</div></div></div>';
    }).join('');
  }

  h += '<button onclick="nuevoCombo()" style="width:100%;padding:14px;margin-top:11px;'
    +   'background:#6A1B9A;color:#fff;border:none;border-radius:11px;font-size:14.5px;'
    +   'font-weight:900;cursor:pointer">➕ Armar un pack nuevo</button>'
    + '<button onclick="cerrarCombos()" style="width:100%;padding:12px;margin-top:7px;'
    +   'background:#F0F0F6;color:#444;border:none;border-radius:10px;font-size:13px;'
    +   'font-weight:700;cursor:pointer">Cerrar</button>';
  document.getElementById('cajaCombos').innerHTML = h;
}

function nuevoCombo(){
  window._comboEdit = { nuevo: true, nombre: '', precio: 0, items: [] };
  pintarEditorCombo();
}
function editarCombo(i){
  var c = COMBOS[i];
  window._comboEdit = { i: i, nombre: c.nombre, precio: c.precio,
                        items: c.items.map(function(x){ return { id: x.id, cant: x.cant || 1 }; }) };
  pintarEditorCombo();
}
function borrarCombo(i){
  if(!confirm('¿Borrar el pack "' + COMBOS[i].nombre + '"?')) return;
  COMBOS.splice(i, 1);
  CAMBIOS = true;
  pintarCombos();
  pintar();
}

function pintarEditorCombo(){
  var e = window._comboEdit;
  if(!e) return;
  // Lo que suman sueltos, para que vea cuánto rebaja
  var suelto = e.items.reduce(function(a, it){
    var p = PRODS.find(function(x){ return x.id === it.id; });
    return a + (p ? p.pr * (it.cant || 1) : 0);
  }, 0);
  var ahorro = Math.round((suelto - (e.precio || 0)) * 100) / 100;

  var h = '<h2>📦 ' + (e.nuevo ? 'Pack nuevo' : 'Cambiar pack')
    +   ' <button onclick="pintarCombos()" style="background:#F0F0F6;border:none;'
    +   'border-radius:8px;width:32px;height:32px;font-size:15px;cursor:pointer">✕</button></h2>'

    + '<div class="et">NOMBRE DEL PACK</div>'
    + '<input id="cNom" value="' + esc(e.nombre) + '" placeholder="Ej: PACK BARBERO COMPLETO" '
    +   'oninput="window._comboEdit.nombre=this.value">'

    + '<div class="et" style="margin-top:12px">PRODUCTOS DEL PACK ('
    +   e.items.length + ')</div>';

  if(!e.items.length){
    h += '<div style="background:#F6F6FA;border-radius:9px;padding:13px;text-align:center;'
      + 'font-size:12.5px;color:#8A8B9E">Todavía no has puesto ninguno</div>';
  } else {
    h += e.items.map(function(it, j){
      var p = PRODS.find(function(x){ return x.id === it.id; });
      return '<div style="display:flex;align-items:center;gap:8px;padding:8px 0;'
        + 'border-bottom:1px solid #F0F0F6">'
        + '<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700">'
        +   esc(p ? p.n : '?') + '</div>'
        +   '<div style="font-size:11px;color:#8A8B9E">' + (p ? dinero(p.pr) : '') + ' c/u'
        +   (p && p.dormido ? ' · 💀 dormido' : '') + '</div></div>'
        + '<button onclick="menosCombo(' + j + ')" style="width:29px;height:29px;'
        +   'border-radius:7px;border:1.5px solid #D4D5E0;background:#fff;cursor:pointer">−</button>'
        + '<span style="font-weight:900;min-width:20px;text-align:center">' + (it.cant||1) + '</span>'
        + '<button onclick="masCombo(' + j + ')" style="width:29px;height:29px;'
        +   'border-radius:7px;border:none;background:#6A1B9A;color:#fff;cursor:pointer">+</button>'
        + '<button onclick="quitarDelCombo(' + j + ')" style="width:29px;height:29px;'
        +   'border-radius:7px;border:1.5px solid #C62828;background:#FFF5F5;cursor:pointer">🗑️</button>'
        + '</div>';
    }).join('');
  }

  h += '<input id="cBusca" placeholder="🔍 Buscar para agregar…" oninput="buscarParaCombo(this.value)" '
    +   'style="margin-top:11px">'
    + '<div style="display:flex;gap:5px;margin-top:6px">'
    +   '<button onclick="buscarParaCombo(\'\',true)" style="flex:1;padding:8px;'
    +     'background:#FFEBEE;color:#C62828;border:1.5px solid #C62828;border-radius:8px;'
    +     'font-size:11.5px;font-weight:800;cursor:pointer">💀 Ver los dormidos</button>'
    + '</div>'
    + '<div id="resCombo" style="max-height:190px;overflow:auto;margin-top:7px"></div>'

    + '<div class="et" style="margin-top:12px">PRECIO DEL PACK</div>'
    + '<input id="cPre" type="number" step="0.01" value="' + (e.precio || '') + '" '
    +   'placeholder="0.00" oninput="window._comboEdit.precio=parseFloat(this.value)||0;pintarResumenCombo()">'

    + '<div id="resumenCombo" style="background:#F3E5F5;border-radius:10px;padding:11px;'
    +   'margin-top:10px;text-align:center"></div>'

    + '<div class="btns"><button class="ok" onclick="guardarCombo()" '
    +   'style="background:#6A1B9A">✓ Guardar pack</button>'
    +   '<button class="no" onclick="pintarCombos()">Cancelar</button></div>';

  document.getElementById('cajaCombos').innerHTML = h;
  pintarResumenCombo();
  buscarParaCombo('', true);
}

function pintarResumenCombo(){
  var e = window._comboEdit;
  var caja = document.getElementById('resumenCombo');
  if(!e || !caja) return;
  var suelto = 0, costo = 0;
  e.items.forEach(function(it){
    var p = PRODS.find(function(x){ return x.id === it.id; });
    if(p){ suelto += p.pr * (it.cant||1); costo += (p.co||0) * (it.cant||1); }
  });
  suelto = Math.round(suelto*100)/100;
  var pre = e.precio || 0;
  var ahorro = Math.round((suelto - pre) * 100) / 100;
  var gana = Math.round((pre - costo) * 100) / 100;
  var margen = pre > 0 ? Math.round(gana / pre * 100) : 0;

  var col = margen < 20 ? '#C62828' : (margen < 30 ? '#E65100' : '#0B7A3B');
  caja.innerHTML = '<div style="font-size:12.5px;color:#6A1B9A">'
    + 'Sueltos valen <b>' + dinero(suelto) + '</b></div>'
    + (pre > 0
        ? '<div style="font-size:13px;font-weight:800;color:#6A1B9A;margin-top:4px">'
          + 'El barbero se ahorra ' + dinero(ahorro) + '</div>'
          + '<div style="font-size:12.5px;font-weight:800;color:' + col + ';margin-top:5px">'
          + '📊 Te queda ' + dinero(gana) + ' (' + margen + '%) '
          + (margen < 20 ? '⚠️' : (margen < 30 ? '🟠' : '✅')) + '</div>'
          + (margen < 20 ? '<div style="font-size:11px;color:#C62828;margin-top:3px">'
                         + 'Es muy poco. Sube el precio del pack.</div>' : '')
        : '<div style="font-size:12px;color:#8A8B9E;margin-top:4px">Ponle un precio</div>');
}

function buscarParaCombo(q, dormidos){
  var caja = document.getElementById('resCombo');
  if(!caja) return;
  var e = window._comboEdit;
  var lista;
  if(dormidos){
    // 💀 Los dormidos primero: es lo que hay que mover
    lista = PRODS.filter(function(p){ return p.dormido; }).slice(0, 40);
  } else {
    q = (q||'').toLowerCase().trim();
    if(!q){ caja.innerHTML = ''; return; }
    lista = PRODS.filter(function(p){
      return ((p.n||'') + ' ' + (p.m||'')).toLowerCase().indexOf(q) >= 0;
    }).slice(0, 25);
  }
  var yaEstan = {};
  e.items.forEach(function(it){ yaEstan[it.id] = true; });
  caja.innerHTML = lista.length
    ? lista.map(function(p){
        if(yaEstan[p.id]) return '';
        return '<div onclick="agregarAlCombo(\'' + p.id + '\')" '
          + 'style="padding:8px;border:1px solid #E5E6EE;border-radius:8px;margin-bottom:5px;'
          + 'cursor:pointer;font-size:12.5px;font-weight:700">'
          + esc(p.n) + '<span style="color:#8A8B9E;font-weight:600"> · ' + dinero(p.pr) + '</span>'
          + (p.dormido ? '<span style="color:#C62828;font-weight:900"> 💀</span>' : '')
          + '</div>';
      }).join('')
    : '<div style="padding:11px;text-align:center;color:#8A8B9E;font-size:12px">'
      + (dormidos ? 'No tienes productos dormidos 🎉' : 'No encontré nada') + '</div>';
}

function agregarAlCombo(id){
  var e = window._comboEdit;
  if(!e) return;
  if(e.items.some(function(x){ return x.id === id; })) return;
  e.items.push({ id: id, cant: 1 });
  pintarEditorCombo();
}
function masCombo(j){ window._comboEdit.items[j].cant++; pintarEditorCombo(); }
function menosCombo(j){
  var it = window._comboEdit.items[j];
  it.cant--;
  if(it.cant < 1) window._comboEdit.items.splice(j, 1);
  pintarEditorCombo();
}
function quitarDelCombo(j){ window._comboEdit.items.splice(j, 1); pintarEditorCombo(); }

function guardarCombo(){
  var e = window._comboEdit;
  var nom = (document.getElementById('cNom').value || '').trim();
  if(!nom){ alert('Ponle un nombre al pack.'); return; }
  if(!e.items.length){ alert('Ponle al menos un producto.'); return; }
  var pre = parseFloat(document.getElementById('cPre').value) || 0;
  if(pre <= 0){ alert('Ponle un precio al pack.'); return; }
  var nuevo = { nombre: nom.toUpperCase(), precio: pre, items: e.items };
  if(e.nuevo) COMBOS.push(nuevo);
  else COMBOS[e.i] = nuevo;
  CAMBIOS = true;
  window._comboEdit = null;
  pintarCombos();
  pintar();
}

window.addEventListener('beforeunload', function(e){
  if(CAMBIOS){ e.preventDefault(); e.returnValue = ''; }
});
</script>
</body>
</html>
